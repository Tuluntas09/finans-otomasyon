name: Daily Snapshot

# Her gün 06:00 UTC = 09:00 Türkiye'de çalışır.
# Manuel tetiklemek için Actions sekmesinden "Run workflow" düğmesi de var.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # DB güncellemesini commit etmek için

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily snapshot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python -m jobs.daily_snapshot

      - name: Commit updated DB
        run: |
          git config --global user.name  "finans-bot"
          git config --global user.email "bot@users.noreply.github.com"
          if [ -f data/finans.db ]; then
            git add -f data/finans.db
            if git diff --staged --quiet; then
              echo "No DB changes — skipping commit"
            else
              git commit -m "chore(data): daily snapshot $(date -u +%F)"
              git push
            fi
          else
            echo "Henüz veritabanı yok"
          fi
